# ng-runner-policy: hosted-compatible-v1
name: Trivy filesystem scan

run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:

    inputs:
      action:
        description: Run the security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select a compatible hosted runner pool
        required: true
        type: choice
        options: [public]
permissions:
  contents: read

concurrency:
  group: trivy-fs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trivy:
    name: Trivy source, dependency, and configuration scan
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'public' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest Trivy release
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # latest
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan applicable repository files
        run: ./scripts/security-scan-local.sh --trivy-only --ci
