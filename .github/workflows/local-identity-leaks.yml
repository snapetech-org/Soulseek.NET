# ng-runner-policy: hosted-compatible-v1
name: Local Identity Leak Check

run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:

    inputs:
      action:
        description: Run the security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select a compatible hosted runner pool
        required: true
        type: choice
        options: [public]
jobs:
  local-identity-leaks:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'public' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install scanner dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Check release-facing text
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          LOCAL_IDENTITY_SCAN_COMMITS: "1"
        run: bash scripts/check-local-identity-leaks.sh
